# Only the settings this project needs; anything not declared here is left as it is.

[auth]
# Where sign-in links send people: the main address (the bare domain redirects to it).
site_url = "https://www.ideora.space"
# Sign-in links may only return to these. The localhost line is for `npm run dev`.
additional_redirect_urls = ["https://www.ideora.space/**", "https://ideora.space/**", "http://localhost:5174/**"]

[functions.news]
# Public: anyone browsing the example month can see What's new.
verify_jwt = false

[functions.razorpay-webhook]
# Called by Razorpay, which has no Supabase token; every call is checked by its signature instead.
verify_jwt = false

[functions.razorpay-subscription]
verify_jwt = true

[functions.razorpay-verify]
verify_jwt = true

[functions.analyze]
# Signed-in only; it also checks the thought belongs to the caller.
verify_jwt = true
